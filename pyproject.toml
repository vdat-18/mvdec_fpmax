[project]
name = "mvdec-fpmax"
version = "0.1.0"
description = "Enhancing Multi-View Deep Embedded Clustering using Maximal Frequent Itemset Mining."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gower",
    "kmodes",
    "loguru>=0.7.3",
    "matplotlib",
    "mlxtend",
    "numpy",
    "openpyxl",
    "pandas",
    "scipy",
    "scikit-learn==1.6.1",
    "seaborn",
]


[project.scripts]
mvdec-fpmax = "cli:main"
mvdec-evaluate-best = "pipeline.best_evaluation:main"
mvdec-evaluate-common = "pipeline.common_evaluation:main"
mvdec-evaluate-native = "pipeline.native_evaluation:main"
mvdec-audit-runs = "pipeline.mvdec_audit:main"
mvdec-audit-fusion = "pipeline.mvdec_fusion_audit:main"
mvdec-audit-paper-figures = "pipeline.mvdec_paper_figure_audit:main"
mvdec-audit-airpollution = "pipeline.airpollution_forensic:main"
mvdec-reconstruct-airpollution = "pipeline.airpollution_reconstruction:main"
mvdec-fetch-airpollution = "pipeline.airpollution_sources:main"
mvdec-sentinel-airpollution = "pipeline.airpollution_sentinel:main"
mvdec-process-airpollution-no2 = "pipeline.airpollution_no2:main"
mvdec-audit-airpollution-dataset = "pipeline.airpollution_dataset:main"
mvdec-without-ffs = "pipeline.private_without_ffs:main"
mvdec-ffs = "pipeline.private_ffs:main"
mvdec-intuitive = "pipeline.private_intuitive:main"
mvdec-public-matrix = "pipeline.public_reproduction_matrix:main"
dekm-reproduce = "representation_learning.DEKM_dense:main"
dekm-audit-rcv1 = "pipeline.rcv1_reproduction_audit:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
dekm = [
    "gdown",
    "tensorflow>=2.16",
]
airpollution = [
    "geopandas>=1.0",
    "netcdf4>=1.7",
    "rasterio>=1.4",
    "rioxarray>=0.18",
    "xarray>=2024",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["cli", "config"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "paper_replication/intuitive_kprototypes/tests",
]
